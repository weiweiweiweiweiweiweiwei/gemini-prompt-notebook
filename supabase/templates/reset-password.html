<!--
  Supabase → Authentication → Emails → Templates → Reset password
  主旨（Subject）：重設密碼｜常用提示詞
  把下面整段貼到 Message body。{{ .ConfirmationURL }} 會被 Supabase 換成真正的連結。
-->
<div style="font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif; font-size: 17px; line-height: 1.8; color: #1f1f1f; max-width: 520px;">
  <h2 style="font-size: 22px; margin: 0 0 12px;">重設密碼</h2>
  <p>有人（希望是你）要求重設「常用提示詞」的密碼。請按下面的按鈕設定新密碼：</p>
  <p style="margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; padding: 14px 32px; border-radius: 28px; background: #0b57d0; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 18px;">
      設定新密碼
    </a>
  </p>
  <p>按完會回到網頁版，並跳出「設定新密碼」的畫面。這個連結有時間限制、只能用一次；過期的話，回到登入畫面再按一次「忘記密碼？」。</p>
  <p style="color: #5f6368; font-size: 14px;">如果你沒有要重設密碼，不用理會這封信，原本的密碼不會改變。</p>
</div>
