<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<style>
  /* Chrome 的小視窗最大 800 x 600，面板在裡面置中。背景和網頁版一樣是單純的灰。 */
  html, body { margin: 0; width: 780px; height: 600px; overflow: hidden; }
  body { background: #eceef1; }
  @media (prefers-color-scheme: dark) {
    body { background: #131314; }
  }
</style>
</head>
<body>
  <!-- 整個面板由 popup.js 畫出來，和 AI 網站裡、網頁版的是同一份（panel.js） -->
  <script src="store.js"></script>
  <script src="share.js"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud-ext.js"></script>
  <script src="panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
